name: Contributor eligibility

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: contributor-eligibility-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute trusted default-branch code, never code from the PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate eligibility checker
        run: python3 -m unittest discover .github/tests
      - name: Check author and reply
        env:
          GH_TOKEN: ${{ github.token }}
        run: CHECK_DATE=$(date -u +%F) python3 .github/scripts/check_contributor.py
